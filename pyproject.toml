[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localops"
version = "0.1.0"
description = "A local, read-only AI assistant for inspecting a home server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6,<1",
    "paramiko>=4,<5",
    "pydantic-settings>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-mock>=3,<4",
]

[project.scripts]
localops = "localops.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/localops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
